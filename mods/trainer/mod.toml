[mod]
id          = "trainer"
name        = "Trainer"
version     = "0.2.0"
description = "Cheats + sandbox for every edition (2012 EN, Special Edition EN / JP): god mode, heal, gold, dialogue skip, teleport to the cursor (F7), warp to any room, give any item, spawn any character. Each action is the game's own mechanism, exposed by the loader's mod.game ops."
authors     = ["Francesco149"]
target_games = ["sotes_en"]

[loader]
api         = "1.6"       # map.warp / rooms, items.give / catalog, roster.set, coordinates.set, dialogue.skip, actors
min_version = "0.1.0"

[config.god]
type        = "bool"
default     = false
label       = "God mode"
description = "Keep every party member's HP and MP at their maximum."

[config.skip_dialogue]
type        = "bool"
default     = false
label       = "Skip dialogue"
description = "Fast-forward conversations and cutscenes the game's own way: holds TAB for you while an event runs."

[config.force_warp]
type        = "bool"
default     = true
label       = "Force warps"
description = "Warp from anywhere, instantly. Off = the warp item's own rules and dissolve (not in towns, events or rooms that forbid it)."

[config.teleport_key]
type        = "int"
default     = 118
min         = 1
max         = 254
label       = "Teleport key (VK)"
description = "Virtual-key code that teleports the controlled member to the mouse cursor (default 118 = F7)."
